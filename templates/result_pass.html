<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pass Prediction Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-5">
    <h1 class="text-center">Pass Prediction Result</h1>

    <div class="card mt-4 p-4 shadow">
      <h4>Predicted Pass Type:</h4>
      <p><strong>{{ prediction }}</strong></p>

      <h4>Confidence:</h4>
      <p><strong>{{ probability }}%</strong></p>

      <h4>Performance Feedback:</h4>
      <p>{{ feedback }}</p>

      {% if prediction %}
        <div class="mt-4 text-center">
          <img src="{{ url_for('static', filename='images/' + prediction.lower().replace(' ', '_') + '.jpg') }}"
               alt="{{ prediction }} image"
               class="img-fluid rounded"
               style="max-width: 300px;">
        </div>
      {% endif %}
    </div>

    <div class="text-center mt-4">
      <a href="{{ url_for('recognize_pass') }}" class="btn btn-success">Try Another Video</a>
      <a href="{{ url_for('dashboard') }}" class="btn btn-secondary ms-2">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
