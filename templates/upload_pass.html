<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netball Pass Recognition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-5">
    <h1 class="text-center">Netball Pass Recognition</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-danger mt-3">
          {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('recognize_pass') }}" method="POST" enctype="multipart/form-data" class="mt-4">
      <div class="mb-3">
        <label for="video-upload" class="form-label">Upload Video</label>
        <input type="file" name="video" id="video-upload" class="form-control" accept="video/*" required>
      </div>
      <button type="submit" class="btn btn-primary">Analyze Pass</button>
    </form>

    <div class="mt-4">
      <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
